server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # Cada ruta apunta directamente al microservicio por HTTP.
            # La URI es configurable por variable de entorno para poder cambiar
            # entre ejecución local (localhost) y Docker (nombre del contenedor).
            - id: inventario-service
              uri: ${MS_INVENTARIO_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/productos/**,/api/v1/repuesto/**,/api/v1/servicios/**

            - id: ventas-service
              uri: ${MS_VENTAS_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/boletas/**,/api/v1/tipoPago/**

            - id: bicicleta-service
              uri: ${MS_BICICLETA_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/bicicletas/**,/api/v1/colores/**,/api/v1/marcas/**,/api/v1/modelos/**

            - id: persona-service
              uri: ${MS_PERSONA_URI:http://localhost:8084}
              predicates:
                - Path=/api/v1/clientes/**,/api/v1/empleados/**
