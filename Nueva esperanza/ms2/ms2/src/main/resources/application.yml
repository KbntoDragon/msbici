spring:
  application:
    name: ms2
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8082

---
# Perfil DEV: base de datos local y inventario en localhost
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://localhost:3306/db_ventas?createDatabaseIfNotExist=true
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
ms:
  inventario:
    url: http://localhost:8081

---
# Perfil PROD: valores desde variables de entorno (Docker / remoto)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
ms:
  inventario:
    url: ${MS_INVENTARIO_URL:http://ms:8081}
